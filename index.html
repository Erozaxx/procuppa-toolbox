<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Procuppa Toolbox</title>
  <style>
    :root {
      --color-primary: #1A1A1A;
      --color-accent: #FFD956;
      --color-bg: #FAFAF8;
      --color-surface: #FFFFFF;
      --color-text: #1A1A1A;
      --color-text-muted: #5C6370;
      --color-border: #E5E3DC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      max-width: 880px;
      margin: 0 auto;
      border-bottom: 4px solid var(--color-accent);
    }
    header h1 { margin: 0; font-size: 1.4rem; }
    .lang button {
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
    }
    .lang button[aria-pressed="true"] {
      background: var(--color-primary);
      color: #FFFFFF;
      border-color: var(--color-primary);
    }
    main { max-width: 880px; margin: 0 auto; padding: 16px; }
    .intro { color: var(--color-text-muted); margin: 8px 0 24px; }
    ul.tools {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .tools a, .tools .soon {
      display: block;
      height: 100%;
      padding: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-accent);
      color: var(--color-text);
      text-decoration: none;
    }
    .tools a:hover, .tools a:focus-visible { border-color: var(--color-primary); }
    .tools strong { display: block; font-size: 1.05rem; }
    .tools span { color: var(--color-text-muted); font-size: 0.92rem; }
    .tools .soon { opacity: 0.6; border-left-color: var(--color-border); }
    footer { max-width: 880px; margin: 24px auto; padding: 0 16px; color: var(--color-text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Procuppa Toolbox</h1>
    <div class="lang" role="group" aria-label="Jazyk / Language">
      <button type="button" data-lang="cs" aria-pressed="true">CZ</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main>
    <p class="intro" data-i18n="intro"></p>
    <ul class="tools">
      <li><a href="toolbox-1-kalkulacky.html"><strong data-i18n="t1"></strong><span data-i18n="d1"></span></a></li>
      <li><a href="toolbox-2-naklady.html"><strong data-i18n="t2"></strong><span data-i18n="d2"></span></a></li>
      <li><a href="toolbox-3-dodavatele.html"><strong data-i18n="t3"></strong><span data-i18n="d3"></span></a></li>
      <li><a href="toolbox-4-logistika.html"><strong data-i18n="t4"></strong><span data-i18n="d4"></span></a></li>
      <li><a href="toolbox-5-finance.html"><strong data-i18n="t5"></strong><span data-i18n="d5"></span></a></li>
      <li id="tool-6"><div class="soon"><strong data-i18n="t6"></strong><span data-i18n="soon"></span></div></li>
    </ul>
  </main>
  <footer data-i18n="footer"></footer>
  <script>
    const TEXTS = {
      cs: {
        intro: 'Kalkulačky a pomůcky pro nákupčí. Náhledová verze.',
        t1: '1 · Kalkulačky', d1: 'Změna ceny, procenta, DPH, úspora a kurzy měn',
        t2: '2 · Náklady & úspory', d2: 'TCO, cílová cena, should-cost a rozpad ceny',
        t3: '3 · Dodavatelé & rizika', d3: 'Hodnocení dodavatele, risk checker a závislost',
        t4: '4 · Logistika', d4: 'Dodací doba, pojistná zásoba, bod objednání a Incoterms',
        t5: '5 · Finance & smlouvy', d5: 'Splatnost, zálohy, skonto a sankce',
        t6: '6 · Rychlá pomoc', soon: 'Připravuje se',
        footer: 'Náhled pro interní testování. Výpočty probíhají jen ve vašem prohlížeči.'
      },
      en: {
        intro: 'Calculators and aids for procurement professionals. Preview version.',
        t1: '1 · Calculators', d1: 'Price change, percentages, VAT, savings and exchange rates',
        t2: '2 · Costs & savings', d2: 'TCO, target price, should-cost and price breakdown',
        t3: '3 · Suppliers & risks', d3: 'Supplier scorecard, risk checker and dependency',
        t4: '4 · Logistics', d4: 'Lead time, safety stock, reorder point and Incoterms',
        t5: '5 · Finance & contracts', d5: 'Payment terms, advances, early payment discount and penalties',
        t6: '6 · Quick help', soon: 'Coming soon',
        footer: 'Preview for internal testing. All calculations run only in your browser.'
      }
    };
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = TEXTS[lang][el.dataset.i18n];
      });
      document.querySelectorAll('.lang button').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
    }
    document.querySelectorAll('.lang button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });
    setLang('cs');
  </script>
</body>
</html>
